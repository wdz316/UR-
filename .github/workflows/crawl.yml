name: 每日更新UR东京空室

on:
  schedule:
    - cron: '0 22 * * *'  # 07:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 测试门禁
        run: python -m pytest tests -q
        working-directory: .
      - name: 爬取东京空室
        run: python crawler/ur_tokyo.py
      - name: 构建双版本页面
        run: python crawler/build_demo.py
      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ur_tokyo.json demo/index.html demo/index_cn.html
          git diff --cached --quiet || git commit -m "chore(data): 每日自动更新 $(date -u +%F)"
          git push

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
