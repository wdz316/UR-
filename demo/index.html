<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UR找房 · 东京（列表+地图）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{font-family:system-ui,sans-serif;margin:0;display:flex;height:100vh}
#side{width:440px;min-width:320px;padding:12px;overflow:auto;border-right:1px solid #ddd}
#map{flex:1}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters label{font-size:12px;display:flex;flex-direction:column;gap:4px}
.card{border:1px solid #e3e3e3;border-radius:8px;padding:8px;margin-bottom:8px}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:#0b6bcb}
.card b{font-size:14px}
.card.norent{border:2px solid #d97706;background:#fffbeb}
.badge{display:inline-block;font-size:12px;color:#92400e;background:#fde68a;border-radius:4px;padding:1px 6px;margin-left:6px}
.meta{font-size:12px;color:#555}
.count{font-size:13px;margin:6px 0;color:#333}
.src{font-size:12px;color:#888}
a{color:#0b6bcb}
</style>
</head>
<body>
<div id="side">
<h3>UR找房 · 东京 <span class="src" id="src"></span></h3>
<div class="filters">
<label>家賃上限(円)<input id="fRent" type="number" value="150000"></label>
<label>面積下限(m²)<input id="fArea" type="number" value="0"></label>
<label>間取り<select id="fMadori"><option value="">全部</option></select></label>
<label>エリア<select id="fAreaGroup"><option value="">全部</option><option>都心</option><option>城北</option><option>城西</option><option>城南</option><option>城東</option><option>多摩</option></select></label>
<label>路線<select id="fLine"><option value="">全部</option></select></label>
<label>关键字<input id="fKw" placeholder="如 赤羽 / 大島 / 駅名"></label>
</div>
<div class="count" id="count"></div>
<div id="list"></div>
<p class="meta">点击房源卡片可在地图上定位。租金未公示的房源会被高亮，不会被家賃上限筛掉。数据来源UR官网，更新见卡片日期。</p>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// file:// 直接双击时的回退样本；http 服务下会自动加载 ../data/ur_tokyo.json 真实数据
const SAMPLE = [
{"danchi":"光が丘パークタウン ゆりの木通り北","ward":"練馬区","area_group":"城北","address":"練馬区光が丘5-2","rent":95800,"kyoekihi":3500,"madori":"2LDK","area":55.2,"floor":4,"line":"都営大江戸線","station":"光が丘駅","lat":35.7605,"lng":139.6298,"url":"https://www.ur-net.go.jp/chintai/kanto/tokyo/area/","room":"101号室","updated":"2026-09-04"},
{"danchi":"立川幸町","ward":"立川市","area_group":"多摩","address":"立川市幸町4-52-1","rent":null,"kyoekihi":2950,"madori":"3DK","area":56.0,"floor":5,"line":"多摩都市モノレール","station":"玉川上水駅","lat":35.7271,"lng":139.42,"url":"https://www.ur-net.go.jp/chintai/kanto/tokyo/area/","room":"2-3棟502号室","updated":"2026-09-04"}
];
let DATA = SAMPLE;
// 与 tests/test_demo.py 中 filter_units 保持一致：rent 为 null 不参与家賃过滤（常显+高亮）
function filterUnits(units, f){
return units.filter(u =>
((u.rent == null) || (u.rent <= f.maxRent)) && (u.area >= f.minArea) &&
(!f.madori || u.madori === f.madori) &&
(!f.areaGroup || u.area_group === f.areaGroup) &&
(!f.line || u.line === f.line) &&
(!f.kw || (u.danchi+u.ward+(u.address||"")+u.line+u.station+(u.room||"")).includes(f.kw))
);
}
const map = L.map('map').setView([35.70,139.70], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
let markers = [];
function fillOptions(id, values){
const sel = document.getElementById(id);
const cur = sel.value;
sel.innerHTML = '<option value="">全部</option>' + values.map(v => `<option>${v}</option>`).join('');
if (values.includes(cur)) sel.value = cur;
}
function priceHtml(u){
if (u.rent == null) return `<span class="badge">⚠ 租金未公示·问询官网</span>`;
return `¥${u.rent.toLocaleString()}（共益¥${u.kyoekihi ?? "-"}）`;
}
function render(){
const f = {maxRent: +document.getElementById('fRent').value || 1e9,
minArea: +document.getElementById('fArea').value || 0,
madori: document.getElementById('fMadori').value,
areaGroup: document.getElementById('fAreaGroup').value,
line: document.getElementById('fLine').value,
kw: document.getElementById('fKw').value.trim()};
const out = filterUnits(DATA, f);
const nNoRent = out.filter(u => u.rent == null).length;
document.getElementById('count').textContent = `命中 ${out.length} / ${DATA.length} 件` + (nNoRent ? `（${nNoRent} 间租金未公示）` : "");
markers.forEach(m => map.removeLayer(m)); markers = [];
const list = document.getElementById('list'); list.innerHTML = '';
out.forEach((u, idx) => {
const d = document.createElement('div'); d.className = 'card' + (u.rent == null ? ' norent' : '');
d.innerHTML = `<b>${u.danchi}${u.room ? ' ' + u.room : ''}</b><div class="meta">${u.area_group||"-"} · ${u.ward} · ${u.madori} · ${u.area}m² · ${u.floor}F</div><div class="meta">${u.line||""} ${u.station||""} · ${u.address||""}</div><div>${priceHtml(u)} 更新${u.updated}</div><a href="${u.url}" target="_blank">官网详情 →</a>`;
list.appendChild(d);
let mk = null;
if (u.lat && u.lng) mk = L.marker([u.lat,u.lng]).addTo(map).bindPopup(`<b>${u.danchi}</b><br>${u.rent == null ? "租金未公示" : "¥"+u.rent.toLocaleString()} · ${u.madori}`);
markers.push(mk);
// 点击卡片 -> 地图飞到对应位置并打开弹窗（官网链接的点击不受影响）
if (mk) {
d.classList.add('clickable');
d.title = '点击在地图上定位';
d.addEventListener('click', (ev) => {
if (ev.target.tagName === 'A') return;
map.flyTo([u.lat, u.lng], 15, {duration: 0.8});
setTimeout(() => mk.openPopup(), 850);
});
}
});
}
['fRent','fArea','fMadori','fAreaGroup','fLine','fKw'].forEach(id => document.getElementById(id).addEventListener('input', render));
async function boot(){
try {
const r = await fetch('../data/ur_tokyo.json');
if (!r.ok) throw new Error('no data');
DATA = await r.json();
document.getElementById('src').textContent = `真实数据 ${DATA.length} 件`;
} catch (e) {
DATA = SAMPLE;
document.getElementById('src').textContent = `离线样本 ${DATA.length} 件（D:\\UR找房下跑 python -m http.server 再开 /demo/ 看全量）`;
}
fillOptions('fMadori', [...new Set(DATA.map(u => u.madori).filter(Boolean))].sort());
fillOptions('fLine', [...new Set(DATA.map(u => u.line).filter(Boolean))].sort());
render();
}
boot();
</script>
</body>
</html>
