list.appendChild(d);
let mk = null;
if (u.lat && u.lng) mk = L.marker([u.lat,u.lng]).addTo(map).bindPopup(`<b>${u.danchi}</b><br>${u.rent == null ? "租金未公示" : "¥"+u.rent.toLocaleString()} · ${u.madori} · ${walkHtml(u)}`);
markers.push(mk);
if (mk) {
// 点地图点位 -> 左侧滚到对应卡片并闪一下（与点击卡片定位地图反向联动）
mk.on('click', () => {
d.scrollIntoView({behavior: 'smooth', block: 'center'});
d.classList.add('flash');
setTimeout(() => d.classList.remove('flash'), 1600);
});
d.classList.add('clickable');
d.title = '点击在地图上定位';
d.addEventListener('click', (ev) => {
if (ev.target.tagName === 'A') return;
map.flyTo([u.lat, u.lng], 15, {duration: 0.8});
setTimeout(() => mk.openPopup(), 850);
});
}
});
}
function fillStatic(){
const md = [...new Set(DATA.map(u => u.madori).filter(Boolean))].sort();
document.getElementById('fMadori').innerHTML = md.map(v => `<label><input type="checkbox" value="${v}"> ${v}</label>`).join('');
document.getElementById('fMadori').querySelectorAll('input').forEach(c => c.addEventListener('change', render));
const ln = [...new Set(DATA.map(u => u.line).filter(Boolean))].sort();
document.getElementById('fLine').innerHTML = '<option value="">全部</option>' + ln.map(v => `<option>${v}</option>`).join('');
}
function boot(){
fillStatic();
const el = document.getElementById('src');
let txt = `真实数据 ${DATA.length} 件 · ${BUILD_DATE}更新`;
try {
const days = Math.floor((Date.now() - new Date(BUILD_DATE).getTime()) / 86400000);
if (days > 7) txt += `（已${days}天未更新）`;
} catch (e) {}
el.innerHTML = txt + (BUILD_DATE && (Date.now() - new Date(BUILD_DATE).getTime() > 7*86400000) ? '<span class="stale">数据较旧，重跑 python crawler/ur_tokyo.py + build_demo.py</span>' : '');
['fRent','fArea','fLine','fWalk','fKw','fKuOnly','fFavOnly'].forEach(id => document.getElementById(id).addEventListener('input', render));
// 窄屏/旋转时重算地图尺寸，否则地图会白屏或错位
window.addEventListener('resize', () => map.invalidateSize());
setTimeout(() => map.invalidateSize(), 300);
render();
}
boot();
</script>
