const BUILD_DATE = "2026-10-28";
/*DATA-END*/
// 与 tests/test_demo.py 中 filter_units 保持一致
// f: {maxRent, minArea, madori[], line, maxWalk|null, kw, kuOnly, favOnly, favs[]}
// rent==null 常显（高亮）；maxWalk 设限时 walk==null 的会被筛掉；kuOnly 只留 ward 以“区”结尾
// kw 支持空格/逗号/顿号分隔多个词（含全角），命中任意一个词即保留
function splitKw(kw){ return String(kw || "").split(/[\s\u3000,，、]+/).filter(Boolean); }
function filterUnits(units, f){
const kws = splitKw(f.kw);
return units.filter(u =>
((u.rent == null) || (u.rent <= f.maxRent)) && (u.area >= f.minArea) &&
((f.madori.length === 0) || f.madori.includes(u.madori)) &&
(!f.line || u.line === f.line) &&
((f.maxWalk == null) || ((u.walk != null) && (u.walk <= f.maxWalk))) &&
((!f.kuOnly) || String(u.ward || "").endsWith("区")) &&
((kws.length === 0) || kws.some(k => (u.danchi+u.ward+(u.address||"")+(u.line||"")+(u.station||"")+(u.room||"")).includes(k))) &&
((!f.favOnly) || f.favs.includes(favId(u)))
);
}
function favId(u){ return u.danchi + "|" + (u.room || ""); }
function loadFavs(){ try { return JSON.parse(localStorage.getItem("ur_fav_v1") || "[]"); } catch (e) { return []; } }
function saveFavs(a){ localStorage.setItem("ur_fav_v1", JSON.stringify(a)); }
/*TILE-BEGIN*/
const map = L.map('map').setView([35.68,139.60], 10);
// 高德地图瓦片（国内外均可访问，中文标注，方便家人看）
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:['1','2','3','4'],attribution:'© 高德地图 AutoNavi'}).addTo(map);
/*TILE-END*/
let markers = [];
function priceHtml(u){
if (u.rent == null) return `<span class="badge">⚠ 租金未公示·问询官网</span>`;
return `¥${u.rent.toLocaleString()}（共益¥${u.kyoekihi ?? "-"}）`;
}
function walkHtml(u){ return (u.walk == null) ? "步行信息无" : `駅徒歩${u.walk}分`; }
function render(){
let favs = loadFavs();
const checked = [...document.querySelectorAll('#fMadori input:checked')].map(c => c.value);
const wv = document.getElementById('fWalk').value;
const f = {maxRent: +document.getElementById('fRent').value || 1e9,
minArea: +document.getElementById('fArea').value || 0,
madori: checked,
line: document.getElementById('fLine').value,
maxWalk: wv === "" ? null : +wv,
kw: document.getElementById('fKw').value.trim(),
kuOnly: document.getElementById('fKuOnly').checked,
favOnly: document.getElementById('fFavOnly').checked,
favs: favs};
let out = filterUnits(DATA, f);
// 关注的沉底变置顶（保持原顺序稳定）
out = out.filter(u => favs.includes(favId(u))).concat(out.filter(u => !favs.includes(favId(u))));
const nNoRent = out.filter(u => u.rent == null).length;
document.getElementById('count').textContent = `命中 ${out.length} / ${DATA.length} 件` + (nNoRent ? `（${nNoRent} 间租金未公示）` : "") + (favs.length ? `（关注 ${favs.length} 间）` : "");
markers.forEach(m => { if (m) map.removeLayer(m); }); markers = [];
const list = document.getElementById('list'); list.innerHTML = '';
if (out.length === 0) {
// 0 件时说清原因：区分“关键字本身就没有”和“被其他条件筛掉”，避免误以为程序坏了
const kws = splitKw(f.kw);
let why = '当前条件下没有符合的房源。';
if (kws.length) {
const hitIgnoringOthers = filterUnits(DATA, {maxRent: 1e9, minArea: 0, madori: [], line: '', maxWalk: null, kw: f.kw, kuOnly: false, favOnly: false, favs: []});
why = hitIgnoringOthers.length === 0
? `今天数据里没有任何房源含「${kws.join('」「')}」（关键字匹配团地名/行政区/地址/路線/駅名/棟号，共 ${DATA.length} 件）。多个词用空格隔开，命中任一个即显示。`
: `含「${kws.join('」「')}」的房源有 ${hitIgnoringOthers.length} 间，但被其他筛选条件（家賃/面積/間取り/路線/徒歩/23区内/只看关注）筛掉了，放宽试试。`;
}
list.innerHTML = `<div class="card" style="background:#f6f8fa">${why}</div>`;
}
out.forEach((u) => {
const isFav = favs.includes(favId(u));
const d = document.createElement('div');
d.className = 'card' + (u.rent == null ? ' norent' : '') + (isFav ? ' fav' : '');
d.innerHTML = `<button class="star${isFav ? ' on' : ''}" title="关注/取消">★</button><b>${u.danchi}${u.room ? ' ' + u.room : ''}</b><div class="meta">${u.ward} · ${u.madori} · ${u.area}m² · ${u.floor}F · ${walkHtml(u)}</div><div class="meta">${u.line||""} ${u.station||""} · ${u.address||""}</div><div>${priceHtml(u)} 更新${u.updated}</div><a href="${u.url}" target="_blank">官网详情 →</a>`;
d.querySelector('.star').addEventListener('click', (ev) => {
ev.stopPropagation();
let a = loadFavs(); const id = favId(u);
a = a.includes(id) ? a.concat([]).filter(x => x !== id) : a.concat([id]);
saveFavs(a); render();
});
list.appendChild(d);
let mk = null;
if (u.lat && u.lng) mk = L.marker([u.lat,u.lng]).addTo(map).bindPopup(`<b>${u.danchi}</b><br>${u.rent == null ? "租金未公示" : "¥"+u.rent.toLocaleString()} · ${u.madori} · ${walkHtml(u)}`);
markers.push(mk);
if (mk) {
// 点地图点位 -> 左侧滚到对应卡片并闪一下（与点击卡片定位地图反向联动）
mk.on('click', () => {
d.scrollIntoView({behavior: 'smooth', block: 'center'});
d.classList.add('flash');
setTimeout(() => d.classList.remove('flash'), 1600);
});
d.classList.add('clickable');
d.title = '点击在地图上定位';
d.addEventListener('click', (ev) => {
if (ev.target.tagName === 'A') return;
map.flyTo([u.lat, u.lng], 15, {duration: 0.8});
setTimeout(() => mk.openPopup(), 850);
});
}
});
}
function fillStatic(){
const md = [...new Set(DATA.map(u => u.madori).filter(Boolean))].sort();
document.getElementById('fMadori').innerHTML = md.map(v => `<label><input type="checkbox" value="${v}"> ${v}</label>`).join('');
document.getElementById('fMadori').querySelectorAll('input').forEach(c => c.addEventListener('change', render));
const ln = [...new Set(DATA.map(u => u.line).filter(Boolean))].sort();
document.getElementById('fLine').innerHTML = '<option value="">全部</option>' + ln.map(v => `<option>${v}</option>`).join('');
}
function boot(){
fillStatic();
const el = document.getElementById('src');
let txt = `真实数据 ${DATA.length} 件 · ${BUILD_DATE}更新`;
try {
const days = Math.floor((Date.now() - new Date(BUILD_DATE).getTime()) / 86400000);
if (days > 7) txt += `（已${days}天未更新）`;
} catch (e) {}
el.innerHTML = txt + (BUILD_DATE && (Date.now() - new Date(BUILD_DATE).getTime() > 7*86400000) ? '<span class="stale">数据较旧，重跑 python crawler/ur_tokyo.py + build_demo.py</span>' : '');
['fRent','fArea','fLine','fWalk','fKw','fKuOnly','fFavOnly'].forEach(id => document.getElementById(id).addEventListener('input', render));
// 窄屏/旋转时重算地图尺寸，否则地图会白屏或错位
window.addEventListener('resize', () => map.invalidateSize());
setTimeout(() => map.invalidateSize(), 300);
render();
}
boot();
</script>
